Welcome.Intro=Welcome. User, The focus of this tool is download PKGs from direct links but we have others minor features as well.\n\nGood to know:\n
Welcome.DirectDownload=When using the direct download mode, you can turn off the computer or close the DirectPakcageInstaller and your PS4/PS5 will continue the download alone.
Welcome.IndirectDownload=When using the "Proxy Downloads" feature, the PS4/PS5 can't download the game alone and the DirectPackageInstaller must keep open.
Welcome.Resume=Direct PKG urls, using the "Proxy Download" feature or not, can be resumed anytime by just selecting 'resume' in your PS4/PS5 download list.
Welcome.Android=Is recommended to keep your phone in charger to prevent any battery optimization problems.\nIf you're using MIUI, disable the battery optimizations manually in the app properties.
Welcome.Firewall=The DirectPackageInstaller use the port {0} in the "Proxy Downloads" feature, maybe you will need to open the ports in your firewall.
Welcome.Compressed=When downloading directly from compressed files, you can't resume the download after the DirectPackageInstaller is closed, but before close the DirectPackageInstaller you still can pause and resume the download in your PS4.
Welcome.Proxy=If your download speed is very slow, you can try enable the "Proxy Downloads" feature, since this feature has been created just to optimize the download speed.
Welcome.DHCP=With DirectPackageInstaller your PS4/PS5 and PC can do a "Plug And Play" network connection just enable the DHCP Server option and select your network adapter if needed.
Welcome.Footer=Created by marcussacana

