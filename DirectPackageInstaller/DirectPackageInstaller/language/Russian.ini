Welcome.Intro=Добро пожаловать. Пользователь, главная цель этого инструмента - скачивание PKG по прямым ссылкам, но есть и другие небольшие возможности.\n\nПолезно знать:\n
Welcome.DirectDownload=В режиме прямого скачивания вы можете выключить компьютер или закрыть DirectPakcageInstaller, а PS4/PS5 продолжит скачивание самостоятельно.
Welcome.IndirectDownload=При использовании функции "Загрузка через прокси" PS4/PS5 не может скачать игру в одиночку, DirectPackageInstaller должен оставаться открытым.
Welcome.Resume=Прямые ссылки на PKG, независимо от использования функции "Загрузка через прокси", можно всегда возобновить, просто выбрав 'возобновить' в списке загрузок PS4/PS5.
Welcome.Android=Рекомендуется держать телефон на зарядке, чтобы избежать проблем с оптимизацией батареи.\nЕсли вы используете MIUI, отключите оптимизацию батареи вручную в свойствах приложения.
Welcome.Firewall=DirectPackageInstaller использует порт {0} в функции "Загрузка через прокси", возможно, вам потребуется открыть порты в брандмауэре.
Welcome.Compressed=При скачивании напрямую из сжатого файла вы не сможете возобновить загрузку после закрытия DirectPackageInstaller, но пока DirectPackageInstaller открыт, загрузку на PS4 можно ставить на паузу и возобновлять.
Welcome.Proxy=Если скорость скачивания очень низкая, попробуйте включить функцию "Загрузка через прокси" - она создана специально для оптимизации скорости.
Welcome.DHCP=С DirectPackageInstaller ваша PS4/PS5 и ПК могут установить сетевое соединение "Plug And Play", просто включите опцию DHCP-сервера и при необходимости выберите сетевой адаптер.
Welcome.Footer=Создано marcussacana

