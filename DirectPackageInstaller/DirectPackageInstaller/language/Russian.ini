Msg.MissingRuntime=Вышло обновление, но обновиться нельзя, потому что отсутствует необходимая программа.\nСейчас DirectPackageInstaller использует .NET {0}, обновление станет доступно после установки Runtime. Нажмите Да, чтобы открыть страницу загрузки.
