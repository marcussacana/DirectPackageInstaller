Msg.BadFileHosting=Этот файлообменник ограничен. Хоть он и совместим с DirectPackageInstaller, использовать его не рекомендуется - предпочтите сервисы вроде alldebrid, иначе возможны проблемы с соединением и/или скоростью.\nСжатые файлы тоже не будут работать как надо: DirectPackageInstaller придётся сначала скачать файл целиком.
