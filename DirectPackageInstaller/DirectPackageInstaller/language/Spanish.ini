Welcome.Intro=Bienvenido. Usuario, el objetivo de esta herramienta es descargar PKG desde enlaces directos, pero también tenemos otras funciones menores.\n\nBueno saber:\n
Welcome.DirectDownload=Cuando usas el modo de descarga directa, puedes apagar el ordenador o cerrar DirectPakcageInstaller y tu PS4/PS5 continuará la descarga por su cuenta.
Welcome.IndirectDownload=Cuando usas la función "Descargas por proxy", la PS4/PS5 no puede descargar el juego por sí sola y DirectPackageInstaller debe permanecer abierto.
Welcome.Resume=Las URLs directas de PKG, usando o no la función "Descarga por proxy", se pueden reanudar en cualquier momento seleccionando 'reanudar' en la lista de descargas de tu PS4/PS5.
Welcome.Android=Se recomienda mantener el teléfono cargando para evitar problemas de optimización de batería.\nSi usas MIUI, desactiva las optimizaciones de batería manualmente en las propiedades de la aplicación.
Welcome.Firewall=DirectPackageInstaller usa el puerto {0} en la función "Descargas por proxy", es posible que necesites abrir los puertos en tu firewall.
Welcome.Compressed=Cuando descargas directamente desde archivos comprimidos, no puedes reanudar la descarga después de cerrar DirectPackageInstaller, pero mientras esté abierto puedes pausar y reanudar la descarga en tu PS4.
Welcome.Proxy=Si tu velocidad de descarga es muy baja, prueba a activar la función "Descargas por proxy", ya que fue creada justamente para optimizar la velocidad de descarga.
Welcome.DHCP=Con DirectPackageInstaller tu PS4/PS5 y tu PC pueden hacer una conexión de red "Plug And Play", solo activa la opción del servidor DHCP y selecciona tu adaptador de red si es necesario.
Welcome.Footer=Creado por marcussacana

